# Habblaud on local Docker.
#
# Start it with `npm run docker:up`: the script detects the Claude Code accounts on the host and generates
# docker-compose.override.yml (outside version control) with:
#   - READ-ONLY mounts of <account>/projects and <account>/sessions at /claude/<account>/...
#     (never the account's whole folder: credentials and settings live there) and of ~/.habblaud/usage
#     (5h/weekly usage captured by the statusline tap) at /usage;
#   - from Codex, ONLY <folder>/sessions, <folder>/archived_sessions and <folder>/thread-writer-locks at
#     /codex/<account>/... (never auth.json, config.toml, history.jsonl, logs or the SQLite databases);
#   - HABBLAUD_CLAUDE_DIRS, HABBLAUD_CODEX_DIRS, HABBLAUD_ACCOUNTS and HABBLAUD_USAGE_DIR.
# Compose merges the override automatically into any `docker compose ...` run in this folder.
name: habblaud

services:
  habblaud:
    build: .
    image: habblaud:local
    container_name: habblaud
    restart: unless-stopped
    # The transcripts are sensitive: by default the port is published ONLY on the host's local interface
    # (HABBLAUD_BIND=0.0.0.0 in .env opens it to the local network; see the README).
    ports:
      - "${HABBLAUD_BIND:-127.0.0.1}:${HABBLAUD_PORT:-4747}:4747"
      # The port for phone access (with login) is only published after npm run remote:setup: what adds it is the
      # docker-compose.override.yml that docker:up generates.
    volumes:
      - habblaud-data:/data
    # Options that can come from .env (or from the environment) into the container.
    environment:
      HABBLAUD_ALLOWED_HOSTS: ${HABBLAUD_ALLOWED_HOSTS:-}
      HABBLAUD_DEMO: ${HABBLAUD_DEMO:-}
      # The same value as the published port above: the terminal (and what acts on the sessions) only turns on
      # with local bind.
      HABBLAUD_BIND: ${HABBLAUD_BIND:-127.0.0.1}
      HABBLAUD_TERMINAL: ${HABBLAUD_TERMINAL:-}
      # 0 turns off messages from the office (sending messages to the agents from the page and from the terminal).
      HABBLAUD_MENSAGENS: ${HABBLAUD_MENSAGENS:-}
      # 0 turns off the new version check (a query to the releases on GitHub every 6 h).
      HABBLAUD_UPDATE_CHECK: ${HABBLAUD_UPDATE_CHECK:-}
      HABBLAUD_LANG: ${HABBLAUD_LANG:-}
      # 0 turns off the Codex sessions in the office.
      HABBLAUD_CODEX: ${HABBLAUD_CODEX:-}
      # 1 turns on New agent from the office (in Docker, what starts the session is the host helper, npm run
      # codex:bridge; the interactive terminal itself doesn't run in the container).
      HABBLAUD_PTY: ${HABBLAUD_PTY:-}
      # Remote access with login (server/http/remote.ts).
      HABBLAUD_REMOTE_USER: ${HABBLAUD_REMOTE_USER:-}
      HABBLAUD_REMOTE_PASSWORD_HASH: ${HABBLAUD_REMOTE_PASSWORD_HASH:-}
      HABBLAUD_REMOTE_ALLOW: ${HABBLAUD_REMOTE_ALLOW:-}
      HABBLAUD_REMOTE_INSECURE_HTTP: ${HABBLAUD_REMOTE_INSECURE_HTTP:-}
      # Habblaud World (on by default: server.habblaud.com; nothing leaves before the account is created).
      # HABBLAUD_WORLD=0 turns everything off.
      HABBLAUD_WORLD: ${HABBLAUD_WORLD:-}
      HABBLAUD_WORLD_URL: ${HABBLAUD_WORLD_URL:-}
      HABBLAUD_WORLD_DEV: ${HABBLAUD_WORLD_DEV:-}
    # The host as seen from inside the container (local Habblaud World server under test: HABBLAUD_WORLD_URL=
    # http://host.docker.internal:<port> with HABBLAUD_WORLD_DEV=1). On Docker Desktop the name already exists; on
    # Linux, host-gateway points it to the host. Harmless without World.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Hardening: read-only file system (except /data and /tmp), no extra capabilities.
    read_only: true
    # /tmp in memory, with a cap: without `size` Docker lets it use half of the host's RAM.
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Minimal init process: forwards signals and reaps orphan processes.
    init: true

volumes:
  habblaud-data:
